name: Build Suikang Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source
        shell: bash
        run: |
          cat payload/part*.b64 | base64 --decode > source.zip
          unzip -o source.zip -d .
          rm -f source.zip

      - name: Apply V1.1 Excel import upgrade
        shell: bash
        run: |
          base64 --decode payload/v11.patch.gz.b64 | gzip -d > /tmp/v11.patch
          patch -p1 < /tmp/v11.patch

      - name: Apply V1.2 cost-price importer
        shell: bash
        run: |
          cp payload/v12_XlsxProductImporter.java app/src/main/java/com/suikang/sales/XlsxProductImporter.java

      - name: Apply V2 redesign and sales channels
        shell: bash
        run: |
          cat payload/v2_main.part*.b64 | base64 --decode | gzip -d > app/src/main/java/com/suikang/sales/MainActivity.java
          sed -i 's/R\.drawable\.app_logo/R.mipmap.ic_launcher/g' app/src/main/java/com/suikang/sales/MainActivity.java
          cp payload/v2_Models.java app/src/main/java/com/suikang/sales/Models.java
          cp payload/v2_DataStore.java app/src/main/java/com/suikang/sales/DataStore.java
          cp payload/v2_ChannelXlsxExporter.java app/src/main/java/com/suikang/sales/ChannelXlsxExporter.java

          mkdir -p app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            base64 --decode payload/app_logo_128.png.b64 > app/src/main/res/mipmap-$d/ic_launcher.png
            cp app/src/main/res/mipmap-$d/ic_launcher.png app/src/main/res/mipmap-$d/ic_launcher_round.png
          done

      - name: Apply V2.1 persistent image fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/src/main/java/com/suikang/sales/MainActivity.java')
          s=p.read_text()
          old='private InputStream openProductImage(Models.Product p)throws Exception{if(p.imageUri!=null&&!p.imageUri.isEmpty()){Uri u=Uri.parse(p.imageUri);if("file".equalsIgnoreCase(u.getScheme()))return new FileInputStream(new File(u.getPath()));return getContentResolver().openInputStream(u);}if(p.imageAsset!=null&&!p.imageAsset.isEmpty())return getAssets().open(p.imageAsset);return null;}'
          new='''private InputStream openProductImage(Models.Product p)throws Exception{
              Exception last=null;
              if(p.imageUri!=null&&!p.imageUri.trim().isEmpty()){
                  try{
                      Uri u=Uri.parse(p.imageUri);
                      if("file".equalsIgnoreCase(u.getScheme())){
                          String path=u.getPath();
                          if(path!=null){File f=new File(path);if(f.isFile()&&f.length()>0)return new FileInputStream(f);}
                      }else{
                          InputStream in=getContentResolver().openInputStream(u);if(in!=null)return in;
                      }
                  }catch(Exception e){last=e;}
              }
              if(p.imageAsset!=null&&!p.imageAsset.trim().isEmpty()){
                  try{return getAssets().open(p.imageAsset);}catch(Exception e){last=e;}
              }
              File dir=new File(getFilesDir(),"product_images");
              if(dir.isDirectory()){
                  String raw=(p.code!=null&&!p.code.trim().isEmpty())?p.code:p.id;
                  String prefix=(raw==null?"":raw).replaceAll("[^a-zA-Z0-9._-]","_");
                  File[] fs=dir.listFiles();File best=null;
                  if(fs!=null)for(File f:fs){if(!f.isFile())continue;String n=f.getName();if(n.startsWith(prefix+"_")||n.equals(prefix+".jpg")||n.equals(prefix+".jpeg")||n.equals(prefix+".png")){if(best==null||f.lastModified()>best.lastModified())best=f;}}
                  if(best!=null)return new FileInputStream(best);
              }
              if(last!=null)throw last;return null;
          }'''
          if old not in s: raise SystemExit('openProductImage signature not found')
          s=s.replace(old,new)
          marker='private View productCard(Models.Product p){'
          helper='''private boolean hasProductImage(Models.Product p){try(InputStream in=openProductImage(p)){return in!=null;}catch(Exception e){return false;}}\n    private int usableProductImageCount(){int n=0;for(Models.Product p:products)if(hasProductImage(p))n++;return n;}\n\n    '''
          if helper.strip() not in s:s=s.replace(marker,helper+marker)
          s=s.replace('共 "+products.size()+" 个产品，图片与成本价保存在本机','共 "+products.size()+" 个产品，已关联图片 "+usableProductImageCount()+" 张 · 成本价保存在本机')
          s=s.replace('TextView imp=button("导入 Excel",true);','TextView imp=button("导入 / 更新 Excel",true);')
          s=s.replace('保存图片 "+a.imagesSaved+" 张")','保存图片 "+a.imagesSaved+" 张\\n\\n图片已关联到产品库")')
          p.write_text(s)

          p=Path('app/build.gradle')
          s=p.read_text()
          s=re.sub(r'versionCode\s+\d+', 'versionCode 21', s)
          s=re.sub(r"versionName\s+'[^']+'", "versionName '2.1.0'", s)
          p.write_text(s)

          p=Path('app/src/main/AndroidManifest.xml')
          s=p.read_text()
          s=re.sub(r'android:icon="@[^"]+"','android:icon="@mipmap/ic_launcher"',s)
          s=re.sub(r'android:roundIcon="@[^"]+"','android:roundIcon="@mipmap/ic_launcher_round"',s)
          if 'android:icon=' not in s:s=s.replace('android:allowBackup="true"','android:allowBackup="true"\n        android:icon="@mipmap/ic_launcher"\n        android:roundIcon="@mipmap/ic_launcher_round"')
          p.write_text(s)
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build V2.1 APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload V2.1 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuikangSalesManagement-V2.1-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish V2.1 APK to repository
        if: github.event_name == 'push'
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk 'dist/SuikangSalesManagement.apk'
          cp app/build/outputs/apk/debug/app-debug.apk 'dist/SuikangSalesManagement-V2.1.apk'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/SuikangSalesManagement.apk dist/SuikangSalesManagement-V2.1.apk
          git commit -m 'Publish Suikang Sales V2.1 APK' || exit 0
          git push
