name: Build Suikang Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source
        shell: bash
        run: |
          cat payload/part*.b64 | base64 --decode > source.zip
          unzip -o source.zip -d .
          rm -f source.zip

      - name: Apply V1.1 Excel import upgrade
        shell: bash
        run: |
          base64 --decode payload/v11.patch.gz.b64 | gzip -d > /tmp/v11.patch
          patch -p1 < /tmp/v11.patch

      - name: Apply V1.2 cost-price importer
        shell: bash
        run: |
          cp payload/v12_XlsxProductImporter.java app/src/main/java/com/suikang/sales/XlsxProductImporter.java

      - name: Apply V2 redesign and sales channels
        shell: bash
        run: |
          cat payload/v2_main.part*.b64 | base64 --decode | gzip -d > app/src/main/java/com/suikang/sales/MainActivity.java
          cp payload/v2_Models.java app/src/main/java/com/suikang/sales/Models.java
          cp payload/v2_DataStore.java app/src/main/java/com/suikang/sales/DataStore.java
          cp payload/v2_ChannelXlsxExporter.java app/src/main/java/com/suikang/sales/ChannelXlsxExporter.java

          mkdir -p app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            base64 --decode payload/app_logo_128.png.b64 > app/src/main/res/mipmap-$d/ic_launcher.png
            cp app/src/main/res/mipmap-$d/ic_launcher.png app/src/main/res/mipmap-$d/ic_launcher_round.png
          done

          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/build.gradle')
          s=p.read_text()
          s=re.sub(r'versionCode\s+\d+', 'versionCode 20', s)
          s=re.sub(r"versionName\s+'[^']+'", "versionName '2.0.0'", s)
          p.write_text(s)
          p=Path('app/src/main/AndroidManifest.xml')
          s=p.read_text()
          s=re.sub(r'android:icon="@[^"]+"', 'android:icon="@mipmap/ic_launcher"', s)
          s=re.sub(r'android:roundIcon="@[^"]+"', 'android:roundIcon="@mipmap/ic_launcher_round"', s)
          if 'android:icon=' not in s:
              s=s.replace('android:allowBackup="true"', 'android:allowBackup="true"\n        android:icon="@mipmap/ic_launcher"\n        android:roundIcon="@mipmap/ic_launcher_round"')
          p.write_text(s)
          p=Path('app/src/main/res/values/strings.xml')
          s=p.read_text().replace('岁康商贸销售管理系统管理系统','岁康商贸销售管理系统')
          p.write_text(s)
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build V2 APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload V2 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuikangSalesManagement-V2-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish V2 APK to repository
        if: github.event_name == 'push'
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk 'dist/SuikangSalesManagement.apk'
          cp app/build/outputs/apk/debug/app-debug.apk 'dist/SuikangSalesManagement-V2.0.apk'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/SuikangSalesManagement.apk dist/SuikangSalesManagement-V2.0.apk
          git commit -m 'Publish Suikang Sales V2.0 APK' || exit 0
          git push
