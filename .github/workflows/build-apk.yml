name: Build Suikang Android APK

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Reconstruct source
        shell: bash
        run: |
          cat payload/part*.b64 | base64 --decode > source.zip
          unzip -o source.zip -d .
      - name: Inspect seeded products
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          p='app/src/main/assets/products.json'
          a=json.load(open(p,encoding='utf-8'))
          print('COUNT',len(a))
          print('IMAGE_ASSET_NONEMPTY',sum(bool(x.get('imageAsset')) for x in a))
          print('IMAGE_URI_NONEMPTY',sum(bool(x.get('imageUri')) for x in a))
          for x in a[:15]: print(x.get('id'),x.get('name'),x.get('code'),x.get('imageAsset'),x.get('imageUri'))
          print('LAST')
          for x in a[-10:]: print(x.get('id'),x.get('name'),x.get('code'),x.get('imageAsset'),x.get('imageUri'))
          PY
          exit 1
