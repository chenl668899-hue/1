name: Build Fund Ledger Android V1.4 Sync

on:
  push:
    branches: [ fund-ledger-v14-sync ]
    paths:
      - 'fundledger/v14-part*.b64'
      - '.github/workflows/build-fund-ledger-v14.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct V1.4 source
        shell: bash
        run: |
          rm -rf fundledger-v14-build
          mkdir -p fundledger-v14-build
          cat fundledger/v14-part*.b64 | base64 --decode > /tmp/fundledger-v14-source.zip
          unzip -q /tmp/fundledger-v14-source.zip -d fundledger-v14-build
          test -f fundledger-v14-build/app/src/main/AndroidManifest.xml
          test -f fundledger-v14-build/app/src/main/assets/index.html

      - name: Fix HTTP newline escapes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('fundledger-v14-build/app/src/main/java/com/fundledger/app/MainActivity.java')
          s=p.read_text()
          s=s.replace(r"a=='\\n'&&c=='\\n'", r"a=='\n'&&c=='\n'")
          s=s.replace(r'x.endsWith("\\r\\n\\r\\n")', r'x.endsWith("\r\n\r\n")')
          s=s.replace(r'append("\\r\\n")', r'append("\r\n")')
          s=s.replace(r'append("; charset=utf-8\\r\\n")', r'append("; charset=utf-8\r\n")')
          s=s.replace(r'append("Connection: close\\r\\n")', r'append("Connection: close\r\n")')
          s=s.replace(r'append("Access-Control-Allow-Origin: *\\r\\n")', r'append("Access-Control-Allow-Origin: *\r\n")')
          s=s.replace(r'append("Access-Control-Allow-Methods: GET, POST, OPTIONS\\r\\n")', r'append("Access-Control-Allow-Methods: GET, POST, OPTIONS\r\n")')
          s=s.replace(r'append("Access-Control-Allow-Headers: Content-Type, X-FundLedger-Code\\r\\n")', r'append("Access-Control-Allow-Headers: Content-Type, X-FundLedger-Code\r\n")')
          s=s.replace(r'append("Access-Control-Allow-Private-Network: true\\r\\n")', r'append("Access-Control-Allow-Private-Network: true\r\n")')
          p.write_text(s)
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build standard Android APK
        working-directory: fundledger-v14-build
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Verify APK signature and package
        shell: bash
        run: |
          APK='fundledger-v14-build/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          mkdir -p output
          cp "$APK" 'output/FundLedger-Android-V1.4-WiFiSync.apk'
          ls -lh output/FundLedger-Android-V1.4-WiFiSync.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: FundLedger-Android-V1.4-WiFiSync
          path: output/FundLedger-Android-V1.4-WiFiSync.apk
          retention-days: 7
          if-no-files-found: error
