name: Build USDT Ledger APK

on:
  push:
    branches: [ usdt-ledger-apk ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: usdt-ledger-src
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate V2.2 assets
        shell: bash
        run: |
          test -s app/src/main/assets/index.html
          test -s app/src/main/assets/v21.js
          test -s app/src/main/assets/v22.js
          grep -q 'costPointsRate' app/src/main/assets/v22.js
          grep -q 'pointCost' app/src/main/assets/v22.js
          grep -q 'fetchUsdtCnyRate' app/src/main/java/com/usdt/ledger/MainActivity.java
          grep -q 'v22.js' app/src/main/java/com/usdt/ledger/MainActivity.java
          grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'assets/index.html'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'assets/v21.js'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'assets/v22.js'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: USDT-Ledger-V2.2-APK
          path: usdt-ledger-src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to branch
        if: github.event_name == 'push'
        shell: bash
        working-directory: .
        run: |
          mkdir -p dist
          cp usdt-ledger-src/app/build/outputs/apk/debug/app-debug.apk 'dist/USDT-Ledger-V2.2.apk'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'dist/USDT-Ledger-V2.2.apk'
          git commit -m 'Publish USDT Ledger V2.2 APK' || exit 0
          git push origin HEAD:usdt-ledger-apk
