name: Export Reconstructed Suikang Source

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/export-v22-source.yml'

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct source
        shell: bash
        run: |
          cat payload/part*.b64 | base64 --decode > source.zip
          unzip -o source.zip -d .
          rm -f source.zip
          base64 --decode payload/v11.patch.gz.b64 | gzip -d > /tmp/v11.patch
          patch -p1 < /tmp/v11.patch
          cp payload/v12_XlsxProductImporter.java app/src/main/java/com/suikang/sales/XlsxProductImporter.java
          cat payload/v2_main.part*.b64 | base64 --decode | gzip -d > app/src/main/java/com/suikang/sales/MainActivity.java
          sed -i 's/R\.drawable\.app_logo/R.mipmap.ic_launcher/g' app/src/main/java/com/suikang/sales/MainActivity.java
          cp payload/v2_Models.java app/src/main/java/com/suikang/sales/Models.java
          cp payload/v2_DataStore.java app/src/main/java/com/suikang/sales/DataStore.java
          cp payload/v2_ChannelXlsxExporter.java app/src/main/java/com/suikang/sales/ChannelXlsxExporter.java
      - name: Apply persistent image and recovery fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/src/main/java/com/suikang/sales/XlsxProductImporter.java')
          s=p.read_text()
          s=s.replace('if(imageCol>=0&&col>=0&&col!=imageCol)continue;','if(imageCol>=0&&col>=0&&Math.abs(col-imageCol)>1)continue;')
          s=s.replace('ZipEntry ze=zip.getEntry(r.imageEntry);','ZipEntry ze=zip.getEntry(r.imageEntry);if(ze==null&&r.imageEntry.startsWith("/"))ze=zip.getEntry(r.imageEntry.substring(1));if(ze==null){String bn=new File(r.imageEntry).getName();Enumeration<? extends ZipEntry> en=zip.entries();while(en.hasMoreElements()){ZipEntry x=en.nextElement();if(x.getName().endsWith("/"+bn)){ze=x;break;}}}')
          p.write_text(s)
          p=Path('app/src/main/java/com/suikang/sales/MainActivity.java')
          s=p.read_text()
          old='private InputStream openProductImage(Models.Product p)throws Exception{if(p.imageUri!=null&&!p.imageUri.isEmpty()){Uri u=Uri.parse(p.imageUri);if("file".equalsIgnoreCase(u.getScheme()))return new FileInputStream(new File(u.getPath()));return getContentResolver().openInputStream(u);}if(p.imageAsset!=null&&!p.imageAsset.isEmpty())return getAssets().open(p.imageAsset);return null;}'
          new='''private InputStream openProductImage(Models.Product p)throws Exception{\n              Exception last=null;\n              if(p.imageUri!=null&&!p.imageUri.trim().isEmpty()){\n                  try{Uri u=Uri.parse(p.imageUri);if("file".equalsIgnoreCase(u.getScheme())){String path=u.getPath();if(path!=null){File f=new File(path);if(f.isFile()&&f.length()>0)return new FileInputStream(f);}}else{InputStream in=getContentResolver().openInputStream(u);if(in!=null)return in;}}catch(Exception e){last=e;}\n              }\n              if(p.imageAsset!=null&&!p.imageAsset.trim().isEmpty()){try{return getAssets().open(p.imageAsset);}catch(Exception e){last=e;}}\n              File dir=new File(getFilesDir(),"product_images");\n              if(dir.isDirectory()){\n                  String raw=(p.code!=null&&!p.code.trim().isEmpty())?p.code:p.id;\n                  String prefix=(raw==null?"":raw).replaceAll("[^a-zA-Z0-9._-]","_");\n                  File[] fs=dir.listFiles();File best=null;\n                  if(fs!=null)for(File f:fs){if(!f.isFile())continue;String n=f.getName();if(n.startsWith(prefix+"_")||n.equals(prefix+".jpg")||n.equals(prefix+".jpeg")||n.equals(prefix+".png")){if(best==null||f.lastModified()>best.lastModified())best=f;}}\n                  if(best!=null)return new FileInputStream(best);\n              }\n              if(last!=null)throw last;return null;\n          }'''
          if old in s:s=s.replace(old,new)
          p.write_text(s)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: suikang-reconstructed-source
          path: |
            app
            build.gradle
            settings.gradle
            gradle.properties
          if-no-files-found: error
