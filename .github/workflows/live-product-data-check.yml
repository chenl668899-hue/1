name: Live Product Data Check

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/live-product-data-check.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --quiet requests
      - name: Live structured data check
        shell: bash
        run: |
          python - <<'PY'
          import requests, hashlib, json, time, re, sys
          OFFER_ID = 860126827459
          APP_KEY = '12574478'
          BASE = 'https://h5api.m.1688.com/h5'
          UA = 'Mozilla/5.0 (Linux; Android 15; Mobile) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0 Mobile Safari/537.36'
          s = requests.Session()
          s.headers.update({'User-Agent':UA,'Accept':'application/json,text/plain,*/*','Content-Type':'application/x-www-form-urlencoded;charset=UTF-8','Origin':'https://detail.1688.com','Referer':'https://detail.1688.com/'})
          def md5(x): return hashlib.md5(x.encode()).hexdigest()
          def token_from_cookie():
              v=s.cookies.get('_m_h5_tk')
              return v.split('_',1)[0] if v else ''
          ts=str(int(time.time()*1000)); api='mtop.1688.moga.pc.shopcard'; sign=md5('undefined&'+ts+'&'+APP_KEY+'&{}')
          params={'jsv':'2.7.4','appKey':APP_KEY,'t':ts,'sign':sign,'api':api,'v':'1.0','type':'originaljson','dataType':'json','timeout':'20000'}
          r=s.post(f'{BASE}/{api}/1.0/',params=params,data={'data':'{}'},timeout=25)
          print('HANDSHAKE_HTTP=', r.status_code); token=token_from_cookie(); print('TOKEN_OK=', bool(token))
          if not token: print('SET_COOKIE=', r.headers.get('set-cookie','')[:500]); sys.exit(21)
          data={'sk':'','offerId':OFFER_ID,'parametersMap':json.dumps({'fromPC':True},separators=(',',':'))}; ds=json.dumps(data,separators=(',',':'),ensure_ascii=False)
          ts=str(int(time.time()*1000)); api='mtop.1688.laputa.miniod'; sign=md5(token+'&'+ts+'&'+APP_KEY+'&'+ds)
          params={'jsv':'2.7.4','appKey':APP_KEY,'t':ts,'sign':sign,'api':api,'v':'1.0','type':'originaljson','dataType':'json','timeout':'20000','_bx-login':'new'}
          r=s.post(f'{BASE}/{api}/1.0/',params=params,data={'data':ds},timeout=35); print('DETAIL_HTTP=',r.status_code)
          j=r.json(); print('RET=',j.get('ret'))
          if 'SUCCESS' not in ' '.join(j.get('ret',[]) if isinstance(j.get('ret'),list) else [str(j.get('ret'))]): print(json.dumps(j,ensure_ascii=False)[:3000]); sys.exit(22)
          model=(j.get('data') or {}).get('model') or {}; od=((model.get('offerModel') or {}).get('offerDetail') or {}); dm=model.get('dataModel') or {}
          LABELS_NAME={'产品名称','商品名称'}; LABELS_CODE={'商品条形码','条形码','商品货号','货号'}
          def sval(v):
              if v is None:return ''
              if isinstance(v,(str,int,float)):return str(v).strip()
              if isinstance(v,list):
                  for x in v:
                      z=sval(x)
                      if z:return z
              if isinstance(v,dict):
                  for k in ('value','text','name','label','displayValue','attrValue','attributeValue','featureValue','propertyValue','propValue'):
                      if k in v:
                          z=sval(v[k])
                          if z:return z
              return ''
          def find_label(node,labels):
              if isinstance(node,dict):
                  for lab in labels:
                      if lab in node:
                          v=sval(node[lab])
                          if v and v not in labels:return v
                  lk=''
                  for k in ('name','key','attrName','attributeName','featureName','title','propertyName','propName','attributeDisplayName'):
                      if str(node.get(k,'')).strip() in labels:lk=str(node.get(k)).strip();break
                  if lk:
                      for k in ('value','values','attrValue','attributeValue','featureValue','propertyValue','propValue','valueName','displayValue','text'):
                          if k in node:
                              v=sval(node[k])
                              if v and v != lk:return v
                  for v in node.values():
                      z=find_label(v,labels)
                      if z:return z
              elif isinstance(node,list):
                  for v in node:
                      z=find_label(v,labels)
                      if z:return z
              return ''
          def direct(node,keys):
              if isinstance(node,dict):
                  for k,v in node.items():
                      if k.lower() in keys:
                          z=sval(v)
                          if z:return z
                  for v in node.values():
                      z=direct(v,keys)
                      if z:return z
              elif isinstance(node,list):
                  for v in node:
                      z=direct(v,keys)
                      if z:return z
              return ''
          name=find_label(od,LABELS_NAME) or find_label(model,LABELS_NAME) or od.get('subject','') or direct(model,{'productname','offertitle','subject'})
          code=find_label(od,LABELS_CODE) or find_label(model,LABELS_CODE) or direct(od,{'cargonumber','productcode','outerid','articlenumber','barcode'}) or direct(model,{'cargonumber','productcode','outerid','articlenumber','barcode'})
          def nums(node,keypred,out):
              if len(out)>100:return
              if isinstance(node,dict):
                  for k,v in node.items():
                      if keypred(k.lower()):
                          m=re.search(r'\d+(?:\.\d+)?',sval(v).replace(',',''))
                          if m:
                              x=float(m.group())
                              if x>0:out.append(x)
                      nums(v,keypred,out)
              elif isinstance(node,list):
                  for v in node:nums(v,keypred,out)
          pv=[]; nums(dm.get('mainPrice',model),lambda k:k in {'price','offerprice','pricevalue','finalprice','discountprice','saleprice'} or 'unitprice' in k,pv); price=min([x for x in pv if .01<=x<1e7],default=0)
          mv=[]; nums(model,lambda k:k in {'beginamount','minorderquantity','quantitybegin','minorder','moq','startquantity'},mv); moq=min([x for x in mv if 1<=x<1e6],default=0)
          urls=set()
          def imgs(node):
              if isinstance(node,dict):
                  for v in node.values():imgs(v)
              elif isinstance(node,list):
                  for v in node:imgs(v)
              elif isinstance(node,str):
                  for u in re.findall(r"https?://[^\\s\\\"'<>]+",node.replace('\\/','/')):
                      if any(x in u.lower() for x in ('alicdn','alibabausercontent','cbu01')) and not any(x in u.lower() for x in ('logo','avatar','captcha','verify')):urls.add(u)
          imgs(model)
          print('LIVE_NAME=',name); print('LIVE_CODE=',code); print('LIVE_PRICE=',price); print('LIVE_MOQ=',moq); print('LIVE_IMAGES=',len(urls)); print('SUBJECT=',od.get('subject','')); print('FEATURE_ATTRS=',json.dumps(od.get('featureAttributes',[]),ensure_ascii=False)[:6000])
          if not name or name in {'一件代发','自营','自营品牌','品牌'}:sys.exit(31)
          if not code:sys.exit(32)
          if price<=0:sys.exit(33)
          if not urls:sys.exit(34)
          PY
