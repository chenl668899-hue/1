name: Live Product Data Check

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/live-product-data-check.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install --quiet requests
      - name: Check live offer HTML
        shell: bash
        run: |
          python - <<'PY'
          import requests,re,html,json
          offer='860126827459'
          urls=[f'https://detail.1688.com/offer/{offer}.html',f'https://m.1688.com/offer/{offer}.html']
          uas=[
            'Mozilla/5.0 (Linux; Android 15; Mobile) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0 Mobile Safari/537.36',
            'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0 Safari/537.36'
          ]
          for url in urls:
            for ua in uas:
              try:
                r=requests.get(url,headers={'User-Agent':ua,'Accept-Language':'zh-CN,zh;q=0.9'},timeout=30,allow_redirects=True)
                text=r.text
                print('\nURL=',url,'HTTP=',r.status_code,'FINAL=',r.url,'LEN=',len(text))
                print('HAS_PRODUCT_NAME=', '素尔伸缩跳蛋' in text)
                print('HAS_BARCODE=', '6975485494153' in text)
                print('HAS_LABEL_PRODUCT_NAME=', '产品名称' in text)
                print('HAS_LABEL_CARGO=', '货号' in text or '商品条形码' in text)
                print('HAS_CHALLENGE=', any(x in text for x in ['请按照说明进行验证','安全验证','captcha','_____tmd_____']))
                for needle in ['素尔伸缩跳蛋','6975485494153','产品名称','商品条形码','货号']:
                  p=text.find(needle)
                  if p>=0: print('SNIP',needle, re.sub(r'\s+',' ',html.unescape(text[max(0,p-220):p+420]))[:650])
              except Exception as e:
                print('ERR',url,repr(e))
          PY
