name: Test private OKX access

on:
  push:
    branches: [artifact-cleanup]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test authenticated read
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if gh api repos/chenl668899-hue/okx-scanner-android/contents/README.md >/tmp/okx.json 2>/tmp/err; then
            echo PRIVATE_OKX_ACCESS=YES
          else
            echo PRIVATE_OKX_ACCESS=NO
            cat /tmp/err
            exit 1
          fi
