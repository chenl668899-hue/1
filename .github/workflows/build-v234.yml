name: Build Suikang V2.3.4

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-v234:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct source
        shell: bash
        run: |
          cat payload/part*.b64 | base64 --decode > source.zip
          unzip -o source.zip -d .
          rm -f source.zip
          base64 --decode payload/v11.patch.gz.b64 | gzip -d > /tmp/v11.patch
          patch -p1 < /tmp/v11.patch
          cp payload/v12_XlsxProductImporter.java app/src/main/java/com/suikang/sales/XlsxProductImporter.java
          base64 --decode payload/v23_MainActivity.java.gz.b64 | gzip -d > app/src/main/java/com/suikang/sales/MainActivity.java
          base64 --decode payload/v23_DataStore.java.gz.b64 | gzip -d > app/src/main/java/com/suikang/sales/DataStore.java
          cp payload/v2_Models.java app/src/main/java/com/suikang/sales/Models.java
          cp payload/v2_ChannelXlsxExporter.java app/src/main/java/com/suikang/sales/ChannelXlsxExporter.java
          cp payload/v233_PdfQuotationExporter.java app/src/main/java/com/suikang/sales/PdfQuotationExporter.java

      - name: Apply V2.3.4 fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('app/src/main/java/com/suikang/sales/XlsxProductImporter.java')
          s=p.read_text()
          s=s.replace('if(imageCol>=0&&col>=0&&col!=imageCol)continue;','if(imageCol>=0&&col>=0&&Math.abs(col-imageCol)>1)continue;')
          s=s.replace('ZipEntry ze=zip.getEntry(r.imageEntry);','ZipEntry ze=zip.getEntry(r.imageEntry);if(ze==null&&r.imageEntry.startsWith("/"))ze=zip.getEntry(r.imageEntry.substring(1));if(ze==null){String bn=new File(r.imageEntry).getName();Enumeration<? extends ZipEntry> en=zip.entries();while(en.hasMoreElements()){ZipEntry x=en.nextElement();if(x.getName().endsWith("/"+bn)){ze=x;break;}}}')
          p.write_text(s)

          p=Path('app/src/main/java/com/suikang/sales/MainActivity.java')
          s=p.read_text()
          s=s.replace('private TextView summarySales, summaryCost, summaryGross, summaryFreight, summaryOther, summaryNet, summaryMargin;',
          'private TextView summarySales, summaryCost, summaryGross, summaryFreight, summaryOther, summaryNet, summaryMargin, depositBalanceText;\n    private EditText depositRateInput, depositAmountInput;\n    private boolean syncingDeposit=false;')

          s=s.replace('header.setPadding(dp(16),dp(12),dp(16),dp(12));header.setBackgroundColor(C_NAVY);',
          'int statusTop=0;int statusId=getResources().getIdentifier("status_bar_height","dimen","android");if(statusId>0)statusTop=getResources().getDimensionPixelSize(statusId);header.setPadding(dp(12),statusTop+dp(7),dp(16),dp(8));header.setBackgroundColor(C_NAVY);')
          s=s.replace('ImageView logo=new ImageView(this);logo.setImageResource(R.mipmap.ic_launcher);logo.setScaleType(ImageView.ScaleType.CENTER_CROP);header.addView(logo,new LinearLayout.LayoutParams(dp(42),dp(42)));',
          'ImageView logo=new ImageView(this);logo.setImageResource(R.mipmap.suikang_v234_launcher);logo.setScaleType(ImageView.ScaleType.FIT_CENTER);logo.setAdjustViewBounds(true);header.addView(logo,new LinearLayout.LayoutParams(dp(32),dp(32)));')
          s=s.replace('ht.setPadding(dp(12),0,0,0);TextView t=text(title,20,true);','ht.setPadding(dp(8),0,0,0);TextView t=text(title,19,true);')

          s=s.replace('Models.Product pp=findProduct(it.productId);Bitmap bm=pp==null?null:thumb(pp,54,54);','Bitmap bm=thumbOrderItem(it,54,54);')
          s=s.replace('TextView profit=text("毛利润  "+money(it.grossProfit()),13,true);profit.setTextColor(it.grossProfit()>=0?C_PROFIT:C_LOSS);',
          'TextView profit=text(it.salePrice>0?"毛利润  "+money(it.grossProfit()):"毛利润  待填写销售价",13,true);profit.setTextColor(it.salePrice>0?(it.grossProfit()>=0?C_PROFIT:C_LOSS):C_MUTED);')
          s=s.replace('private Models.Product findProduct(String id){for(Models.Product p:products)if(p.id.equals(id))return p;return null;}',
          'private Bitmap thumbOrderItem(Models.OrderItem it,int w,int h){Models.Product tmp=new Models.Product();tmp.imageAsset=it.imageAsset==null?"":it.imageAsset;tmp.imageUri=it.imageUri==null?"":it.imageUri;Bitmap bm=thumb(tmp,w,h);if(bm!=null)return bm;Models.Product pp=findProduct(it.productId);return pp==null?null:thumb(pp,w,h);}\n    private Models.Product findProduct(String id){for(Models.Product p:products)if(p.id.equals(id))return p;return null;}')
          s=s.replace('private void updateProfit(TextView v,Models.OrderItem i){v.setText("毛利润  "+money(i.grossProfit()));v.setTextColor(i.grossProfit()>=0?C_PROFIT:C_LOSS);}',
          'private void updateProfit(TextView v,Models.OrderItem i){if(i.salePrice<=0){v.setText("毛利润  待填写销售价");v.setTextColor(C_MUTED);}else{v.setText("毛利润  "+money(i.grossProfit()));v.setTextColor(i.grossProfit()>=0?C_PROFIT:C_LOSS);}}')

          old='private void recalc(Models.SalesOrder o){if(summarySales==null)return;summarySales.setText(money(o.sales()));summaryCost.setText(money(o.goodsCost()));summaryGross.setText(money(o.grossProfit()));summaryFreight.setText(money(o.freight));summaryOther.setText(money(o.extraFees()));summaryNet.setText(money(o.netProfit()));summaryNet.setTextColor(o.netProfit()>=0?C_PROFIT:C_LOSS);summaryMargin.setText(String.format(Locale.CHINA,"%.2f%%",o.margin()));summaryMargin.setTextColor(o.margin()>=0?C_PROFIT:C_LOSS);}'
          new='private boolean hasMissingSalePrice(Models.SalesOrder o){for(Models.OrderItem it:o.items)if(it.salePrice<=0)return true;return false;}\n    private void syncDepositFromRate(Models.SalesOrder o){if(syncingDeposit)return;syncingDeposit=true;double sales=o.sales();if(o.depositRate<0)o.depositRate=0;if(o.depositRate>100)o.depositRate=100;if(sales>0)o.depositAmount=sales*o.depositRate/100.0;if(depositAmountInput!=null){String v=o.depositAmount>0?num(o.depositAmount):"";if(!depositAmountInput.getText().toString().equals(v)){depositAmountInput.setText(v);depositAmountInput.setSelection(depositAmountInput.length());}}if(depositBalanceText!=null)depositBalanceText.setText("剩余尾款  "+money(Math.max(0,sales-o.depositAmount)));syncingDeposit=false;}\n    private void recalc(Models.SalesOrder o){if(summarySales==null)return;if(o.depositRate>0)syncDepositFromRate(o);else if(depositBalanceText!=null)depositBalanceText.setText("剩余尾款  "+money(Math.max(0,o.sales()-o.depositAmount)));summaryCost.setText(money(o.goodsCost()));summaryFreight.setText(money(o.freight));summaryOther.setText(money(o.extraFees()));if(hasMissingSalePrice(o)){summarySales.setText("待填写");summaryGross.setText("待计算");summaryNet.setText("待计算");summaryMargin.setText("待计算");summaryGross.setTextColor(C_MUTED);summaryNet.setTextColor(C_MUTED);summaryMargin.setTextColor(C_MUTED);return;}summarySales.setText(money(o.sales()));summaryGross.setText(money(o.grossProfit()));summaryGross.setTextColor(o.grossProfit()>=0?C_PROFIT:C_LOSS);summaryNet.setText(money(o.netProfit()));summaryNet.setTextColor(o.netProfit()>=0?C_PROFIT:C_LOSS);summaryMargin.setText(String.format(Locale.CHINA,"%.2f%%",o.margin()));summaryMargin.setTextColor(o.margin()>=0?C_PROFIT:C_LOSS);}'
          if old not in s: raise SystemExit('recalc pattern not found')
          s=s.replace(old,new)

          marker='LinearLayout sum=card();sum.addView(sectionTitle("利润汇总","内部经营数据，不会出现在客户报价版"));'
          pay='LinearLayout payment=card();payment.addView(sectionTitle("付款信息","定金比例和金额自动联动，并自动计算剩余尾款"));LinearLayout payRow=new LinearLayout(this);payRow.setOrientation(LinearLayout.HORIZONTAL);depositRateInput=input("定金比例 %");depositRateInput.setInputType(2|8192);depositRateInput.setText(o.depositRate==0?"":num(o.depositRate));depositAmountInput=input("定金金额");depositAmountInput.setInputType(2|8192);depositAmountInput.setText(o.depositAmount==0?"":num(o.depositAmount));payRow.addView(depositRateInput,new LinearLayout.LayoutParams(0,dp(50),1));LinearLayout.LayoutParams dap=new LinearLayout.LayoutParams(0,dp(50),1);dap.setMargins(dp(8),0,0,0);payRow.addView(depositAmountInput,dap);payment.addView(payRow);depositBalanceText=muted("剩余尾款  "+money(Math.max(0,o.sales()-o.depositAmount)),13);depositBalanceText.setPadding(dp(4),dp(8),0,0);payment.addView(depositBalanceText);page.addView(payment);watch(depositRateInput,v->{if(syncingDeposit)return;syncingDeposit=true;o.depositRate=Math.max(0,Math.min(100,d(v)));double sales=o.sales();o.depositAmount=sales>0?sales*o.depositRate/100.0:0;String a=o.depositAmount>0?num(o.depositAmount):"";depositAmountInput.setText(a);depositAmountInput.setSelection(depositAmountInput.length());depositBalanceText.setText("剩余尾款  "+money(Math.max(0,sales-o.depositAmount)));syncingDeposit=false;});watch(depositAmountInput,v->{if(syncingDeposit)return;syncingDeposit=true;o.depositAmount=Math.max(0,d(v));double sales=o.sales();o.depositRate=sales>0?Math.max(0,Math.min(100,o.depositAmount/sales*100.0)):0;String r=o.depositRate>0?num(o.depositRate):"";depositRateInput.setText(r);depositRateInput.setSelection(depositRateInput.length());depositBalanceText.setText("剩余尾款  "+money(Math.max(0,sales-o.depositAmount)));syncingDeposit=false;});\n        '
          if marker not in s: raise SystemExit('profit summary marker not found')
          s=s.replace(marker,pay+marker)

          s=s.replace('TextView cust=button("导出客户报价 Excel",false);','TextView cust=button("导出客户报价 PDF",false);')
          old_export='private void startExport(Models.SalesOrder o,boolean internal){pendingExportOrder=o;Intent it=new Intent(Intent.ACTION_CREATE_DOCUMENT);it.addCategory(Intent.CATEGORY_OPENABLE);it.setType("application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");String who=o.customerName.trim().isEmpty()?"客户":o.customerName.trim();it.putExtra(Intent.EXTRA_TITLE,"岁康商贸_"+who+"_"+(internal?"内部利润单":"报价单")+"_"+o.date+".xlsx");startActivityForResult(it,internal?501:500);}'
          new_export='private void startExport(Models.SalesOrder o,boolean internal){pendingExportOrder=o;Intent it=new Intent(Intent.ACTION_CREATE_DOCUMENT);it.addCategory(Intent.CATEGORY_OPENABLE);String who=o.customerName.trim().isEmpty()?"客户":o.customerName.trim();if(internal){it.setType("application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");it.putExtra(Intent.EXTRA_TITLE,"岁康商贸_"+who+"_内部利润单_"+o.date+".xlsx");}else{it.setType("application/pdf");it.putExtra(Intent.EXTRA_TITLE,"岁康商贸_"+who+"_客户报价单_"+o.date+".pdf");}startActivityForResult(it,internal?501:500);}'
          if old_export not in s: raise SystemExit('startExport pattern not found')
          s=s.replace(old_export,new_export)
          old_result='if(requestCode==501)XlsxExporter.exportInternal(this,pendingExportOrder,out);else XlsxExporter.exportCustomer(this,pendingExportOrder,out);'
          new_result='if(requestCode==501)XlsxExporter.exportInternal(this,pendingExportOrder,out);else PdfQuotationExporter.export(this,pendingExportOrder,out);'
          if old_result not in s: raise SystemExit('onActivityResult export pattern not found')
          s=s.replace(old_result,new_result)
          p.write_text(s)

          p=Path('app/build.gradle')
          s=p.read_text()
          s=re.sub(r'versionCode\s+\d+','versionCode 234',s)
          s=re.sub(r"versionName\s+'[^']+'","versionName '2.3.4'",s)
          p.write_text(s)
          PY

      - name: Compile safe launcher icon resources
        shell: bash
        run: |
          mkdir -p app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi app/src/main/res/mipmap-anydpi-v26 app/src/main/res/drawable app/src/main/res/values
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            base64 --decode payload/app_logo_128.png.b64 > app/src/main/res/mipmap-$d/suikang_v234_source.png
            cp app/src/main/res/mipmap-$d/suikang_v234_source.png app/src/main/res/mipmap-$d/suikang_v234_launcher.png
            cp app/src/main/res/mipmap-$d/suikang_v234_source.png app/src/main/res/mipmap-$d/suikang_v234_launcher_round.png
          done
          cat > app/src/main/res/drawable/suikang_v234_foreground.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <inset xmlns:android="http://schemas.android.com/apk/res/android"
              android:drawable="@mipmap/suikang_v234_source"
              android:insetLeft="18%"
              android:insetTop="18%"
              android:insetRight="18%"
              android:insetBottom="18%" />
          XML
          python3 - <<'PY'
          from pathlib import Path
          import re
          colors=Path('app/src/main/res/values/colors.xml')
          cs=colors.read_text() if colors.exists() else '<resources>\n</resources>\n'
          if 'name="suikang_v234_bg"' not in cs: cs=cs.replace('</resources>','    <color name="suikang_v234_bg">#0D2741</color>\n</resources>')
          colors.write_text(cs)
          m=Path('app/src/main/AndroidManifest.xml');s=m.read_text()
          s=re.sub(r'android:icon="@[^"]+"','android:icon="@mipmap/suikang_v234_launcher"',s)
          s=re.sub(r'android:roundIcon="@[^"]+"','android:roundIcon="@mipmap/suikang_v234_launcher_round"',s)
          if 'android:icon=' not in s:s=s.replace('android:allowBackup="true"','android:allowBackup="true"\n        android:icon="@mipmap/suikang_v234_launcher"\n        android:roundIcon="@mipmap/suikang_v234_launcher_round"')
          m.write_text(s)
          PY
          cat > app/src/main/res/mipmap-anydpi-v26/suikang_v234_launcher.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/suikang_v234_bg" />
              <foreground android:drawable="@drawable/suikang_v234_foreground" />
          </adaptive-icon>
          XML
          cp app/src/main/res/mipmap-anydpi-v26/suikang_v234_launcher.xml app/src/main/res/mipmap-anydpi-v26/suikang_v234_launcher_round.xml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build V2.3.4 APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Collect signing tools
        run: |
          mkdir -p /tmp/sign-tools
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" /tmp/sign-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" /tmp/sign-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" /tmp/sign-tools/
          chmod +x /tmp/sign-tools/apksigner /tmp/sign-tools/zipalign
      - name: Upload V2.3.4 APK
        uses: actions/upload-artifact@v4
        with:
          name: SuikangSalesManagement-V2.3.4-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload Android signing tools
        uses: actions/upload-artifact@v4
        with:
          name: AndroidSignTools-V234
          path: /tmp/sign-tools
          if-no-files-found: error
