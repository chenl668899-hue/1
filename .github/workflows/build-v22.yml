name: Build Suikang V2.2

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-v22:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct source
        shell: bash
        run: |
          cat payload/part*.b64 | base64 --decode > source.zip
          unzip -o source.zip -d .
          rm -f source.zip
          base64 --decode payload/v11.patch.gz.b64 | gzip -d > /tmp/v11.patch
          patch -p1 < /tmp/v11.patch
          cp payload/v12_XlsxProductImporter.java app/src/main/java/com/suikang/sales/XlsxProductImporter.java
          cat payload/v2_main.part*.b64 | base64 --decode | gzip -d > app/src/main/java/com/suikang/sales/MainActivity.java
          sed -i 's/R\.drawable\.app_logo/R.mipmap.ic_launcher/g' app/src/main/java/com/suikang/sales/MainActivity.java
          cp payload/v2_Models.java app/src/main/java/com/suikang/sales/Models.java
          cp payload/v2_DataStore.java app/src/main/java/com/suikang/sales/DataStore.java
          cp payload/v2_ChannelXlsxExporter.java app/src/main/java/com/suikang/sales/ChannelXlsxExporter.java

      - name: Apply V2.2 fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # XLSX importer: keep 价格 as 成本价 and make picture extraction tolerant.
          p=Path('app/src/main/java/com/suikang/sales/XlsxProductImporter.java')
          s=p.read_text()
          s=s.replace('if(imageCol>=0&&col>=0&&col!=imageCol)continue;','if(imageCol>=0&&col>=0&&Math.abs(col-imageCol)>1)continue;')
          s=s.replace('ZipEntry ze=zip.getEntry(r.imageEntry);','ZipEntry ze=zip.getEntry(r.imageEntry);if(ze==null&&r.imageEntry.startsWith("/"))ze=zip.getEntry(r.imageEntry.substring(1));if(ze==null){String bn=new File(r.imageEntry).getName();Enumeration<? extends ZipEntry> en=zip.entries();while(en.hasMoreElements()){ZipEntry x=en.nextElement();if(x.getName().endsWith("/"+bn)){ze=x;break;}}}')
          p.write_text(s)

          # Persistent image loader + explicit recovery state.
          p=Path('app/src/main/java/com/suikang/sales/MainActivity.java')
          s=p.read_text()
          old='private InputStream openProductImage(Models.Product p)throws Exception{if(p.imageUri!=null&&!p.imageUri.isEmpty()){Uri u=Uri.parse(p.imageUri);if("file".equalsIgnoreCase(u.getScheme()))return new FileInputStream(new File(u.getPath()));return getContentResolver().openInputStream(u);}if(p.imageAsset!=null&&!p.imageAsset.isEmpty())return getAssets().open(p.imageAsset);return null;}'
          new='''private InputStream openProductImage(Models.Product p)throws Exception{
              Exception last=null;
              if(p.imageUri!=null&&!p.imageUri.trim().isEmpty()){
                  try{Uri u=Uri.parse(p.imageUri);if("file".equalsIgnoreCase(u.getScheme())){String path=u.getPath();if(path!=null){File f=new File(path);if(f.isFile()&&f.length()>0)return new FileInputStream(f);}}else{InputStream in=getContentResolver().openInputStream(u);if(in!=null)return in;}}catch(Exception e){last=e;}
              }
              if(p.imageAsset!=null&&!p.imageAsset.trim().isEmpty()){try{return getAssets().open(p.imageAsset);}catch(Exception e){last=e;}}
              File dir=new File(getFilesDir(),"product_images");
              if(dir.isDirectory()){
                  String raw=(p.code!=null&&!p.code.trim().isEmpty())?p.code:p.id;
                  String prefix=(raw==null?"":raw).replaceAll("[^a-zA-Z0-9._-]","_");
                  File[] fs=dir.listFiles();File best=null;
                  if(fs!=null)for(File f:fs){if(!f.isFile())continue;String n=f.getName();if(n.startsWith(prefix+"_")||n.equals(prefix+".jpg")||n.equals(prefix+".jpeg")||n.equals(prefix+".png")){if(best==null||f.lastModified()>best.lastModified())best=f;}}
                  if(best!=null)return new FileInputStream(best);
              }
              if(last!=null)throw last;return null;
          }'''
          if old in s:s=s.replace(old,new)
          marker='private View productCard(Models.Product p){'
          helper='''private boolean hasProductImage(Models.Product p){try(InputStream in=openProductImage(p)){return in!=null;}catch(Exception e){return false;}}\n    private int usableProductImageCount(){int n=0;for(Models.Product p:products)if(hasProductImage(p))n++;return n;}\n\n    '''
          if helper.strip() not in s:s=s.replace(marker,helper+marker)
          s=s.replace('共 "+products.size()+" 个产品，图片与成本价保存在本机','共 "+products.size()+" 个产品，已关联图片 "+usableProductImageCount()+" 张 · "+(usableProductImageCount()==0?"请选择原 Excel 恢复图片":"图片已保存到本机")+" · 成本价保存在本机')
          s=s.replace('TextView imp=button("导入 Excel",true);','TextView imp=button(usableProductImageCount()==0?"恢复产品图片 / 导入 Excel":"导入 / 更新 Excel",true);')
          s=s.replace('TextView imp=button("导入 / 更新 Excel",true);','TextView imp=button(usableProductImageCount()==0?"恢复产品图片 / 导入 Excel":"导入 / 更新 Excel",true);')
          p.write_text(s)

          # Version 2.2.0
          p=Path('app/build.gradle')
          s=p.read_text()
          s=re.sub(r'versionCode\s+\d+', 'versionCode 22', s)
          s=re.sub(r"versionName\s+'[^']+'", "versionName '2.2.0'", s)
          p.write_text(s)
          PY

          # Brand-new launcher resource names; avoids old ic_launcher resource reuse.
          mkdir -p app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi app/src/main/res/mipmap-anydpi-v26 app/src/main/res/values
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            base64 --decode payload/app_logo_128.png.b64 > app/src/main/res/mipmap-$d/suikang_v22_launcher.png
            cp app/src/main/res/mipmap-$d/suikang_v22_launcher.png app/src/main/res/mipmap-$d/suikang_v22_launcher_round.png
            cp app/src/main/res/mipmap-$d/suikang_v22_launcher.png app/src/main/res/mipmap-$d/suikang_v22_launcher_foreground.png
          done
          python3 - <<'PY'
          from pathlib import Path
          import re
          colors=Path('app/src/main/res/values/colors.xml')
          cs=colors.read_text() if colors.exists() else '<resources>\n</resources>\n'
          if 'name="suikang_launcher_bg"' not in cs:
              cs=cs.replace('</resources>','    <color name="suikang_launcher_bg">#0D2741</color>\n</resources>')
          colors.write_text(cs)
          manifest=Path('app/src/main/AndroidManifest.xml')
          s=manifest.read_text()
          s=re.sub(r'android:icon="@[^"]+"','android:icon="@mipmap/suikang_v22_launcher"',s)
          s=re.sub(r'android:roundIcon="@[^"]+"','android:roundIcon="@mipmap/suikang_v22_launcher_round"',s)
          if 'android:icon=' not in s:s=s.replace('android:allowBackup="true"','android:allowBackup="true"\n        android:icon="@mipmap/suikang_v22_launcher"\n        android:roundIcon="@mipmap/suikang_v22_launcher_round"')
          manifest.write_text(s)
          PY
          cat > app/src/main/res/mipmap-anydpi-v26/suikang_v22_launcher.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/suikang_launcher_bg" />
              <foreground android:drawable="@mipmap/suikang_v22_launcher_foreground" />
          </adaptive-icon>
          XML
          cp app/src/main/res/mipmap-anydpi-v26/suikang_v22_launcher.xml app/src/main/res/mipmap-anydpi-v26/suikang_v22_launcher_round.xml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build V2.2 APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Upload V2.2 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuikangSalesManagement-V2.2-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish V2.2 APK
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/SuikangSalesManagement.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/SuikangSalesManagement-V2.2.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/SuikangSalesManagement.apk dist/SuikangSalesManagement-V2.2.apk
          git commit -m 'Publish Suikang Sales V2.2 APK' || exit 0
          git push
