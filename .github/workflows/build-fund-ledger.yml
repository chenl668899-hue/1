name: Build Fund Ledger Android V1.0.1

on:
  push:
    branches: [ fund-ledger-v101 ]
    paths:
      - 'fundledger/source.zip.b64'
      - '.github/workflows/build-fund-ledger.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct Fund Ledger source
        shell: bash
        run: |
          rm -rf fundledger-build
          mkdir -p fundledger-build
          base64 --decode fundledger/source.zip.b64 > /tmp/fundledger-source.zip
          unzip -q /tmp/fundledger-source.zip -d fundledger-build
          test -f fundledger-build/app/src/main/AndroidManifest.xml
          test -f fundledger-build/app/src/main/assets/index.html

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build standard Android APK
        working-directory: fundledger-build
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Verify APK signature and package
        shell: bash
        run: |
          APK='fundledger-build/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          mkdir -p output
          cp "$APK" 'output/FundLedger-Android-V1.0.1-Android17.apk'
          ls -lh output/FundLedger-Android-V1.0.1-Android17.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: FundLedger-Android-V1.0.1-Android17
          path: output/FundLedger-Android-V1.0.1-Android17.apk
          retention-days: 7
          if-no-files-found: error
