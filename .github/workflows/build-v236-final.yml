name: Build Suikang V2.3.6 Final

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-v236-final.yml'

jobs:
  build-v236-final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct base source
        shell: bash
        run: |
          cat payload/part*.b64 | base64 --decode > source.zip
          unzip -o source.zip -d .
          rm -f source.zip
          base64 --decode payload/v11.patch.gz.b64 | gzip -d > /tmp/v11.patch
          patch -p1 < /tmp/v11.patch
          cp payload/v12_XlsxProductImporter.java app/src/main/java/com/suikang/sales/XlsxProductImporter.java
          cp payload/v2_DataStore.java app/src/main/java/com/suikang/sales/DataStore.java
          cp payload/v2_ChannelXlsxExporter.java app/src/main/java/com/suikang/sales/ChannelXlsxExporter.java

      - name: Restore V2.3.6 sources
        shell: bash
        run: |
          cat payload/v236_main.part0.b64 payload/v236_main.rest.b64 | base64 --decode | gzip -d > app/src/main/java/com/suikang/sales/MainActivity.java
          base64 --decode payload/v236_models.java.gz.b64 | gzip -d > app/src/main/java/com/suikang/sales/Models.java
          base64 --decode payload/v236_pdf.java.gz.b64 | gzip -d > app/src/main/java/com/suikang/sales/PdfQuotationExporter.java
          base64 --decode payload/v236_link.java.gz.b64 | gzip -d > app/src/main/java/com/suikang/sales/ProductLinkImporter.java
          base64 --decode payload/v236_export.java.gz.b64 | gzip -d > app/src/main/java/com/suikang/sales/ProductLibraryXlsxExporter.java
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/build.gradle')
          s=p.read_text()
          s=re.sub(r'versionCode\s+\d+', 'versionCode 236', s)
          s=re.sub(r"versionName\s+'[^']+'", "versionName '2.3.6'", s)
          p.write_text(s)
          m=Path('app/src/main/AndroidManifest.xml')
          s=m.read_text()
          if 'android.permission.INTERNET' not in s:
              s=s.replace('<application', '<uses-permission android:name="android.permission.INTERNET" />\n    <application',1)
          m.write_text(s)
          PY

      - name: Optimized launcher icon
        shell: bash
        run: |
          mkdir -p app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi app/src/main/res/mipmap-anydpi-v26 app/src/main/res/values
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            base64 --decode payload/app_logo_128.png.b64 > app/src/main/res/mipmap-$d/suikang_v236_launcher.png
            cp app/src/main/res/mipmap-$d/suikang_v236_launcher.png app/src/main/res/mipmap-$d/suikang_v236_launcher_round.png
            cp app/src/main/res/mipmap-$d/suikang_v236_launcher.png app/src/main/res/mipmap-$d/suikang_v236_launcher_foreground.png
          done
          python3 - <<'PY'
          from pathlib import Path
          import re
          colors=Path('app/src/main/res/values/colors.xml')
          cs=colors.read_text() if colors.exists() else '<resources>\n</resources>\n'
          if 'name="suikang_launcher_bg"' not in cs:
              cs=cs.replace('</resources>','    <color name="suikang_launcher_bg">#0D2741</color>\n</resources>')
          colors.write_text(cs)
          manifest=Path('app/src/main/AndroidManifest.xml')
          s=manifest.read_text()
          s=re.sub(r'android:icon="@[^"]+"','android:icon="@mipmap/suikang_v236_launcher"',s)
          s=re.sub(r'android:roundIcon="@[^"]+"','android:roundIcon="@mipmap/suikang_v236_launcher_round"',s)
          if 'android:icon=' not in s:
              s=s.replace('android:allowBackup="true"','android:allowBackup="true"\n        android:icon="@mipmap/suikang_v236_launcher"\n        android:roundIcon="@mipmap/suikang_v236_launcher_round"')
          manifest.write_text(s)
          PY
          cat > app/src/main/res/mipmap-anydpi-v26/suikang_v236_launcher.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/suikang_launcher_bg" />
              <foreground android:drawable="@mipmap/suikang_v236_launcher_foreground" />
          </adaptive-icon>
          XML
          cp app/src/main/res/mipmap-anydpi-v26/suikang_v236_launcher.xml app/src/main/res/mipmap-anydpi-v26/suikang_v236_launcher_round.xml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: SuikangSalesManagement-V2.3.6-Build
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
