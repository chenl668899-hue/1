name: Deploy Suikang PWA V1.0

on:
  push:
    branches: [ mac-v1 ]
    paths:
      - 'pwa/**'
      - '.github/workflows/deploy-pwa.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  SITE_DIR: pwa_site

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct PWA site
        shell: bash
        run: |
          rm -rf "$SITE_DIR"
          mkdir -p "$SITE_DIR"
          cat pwa/bundle.part* | tr -d '\r\n' | base64 --decode > /tmp/suikang-pwa.zip
          unzip -t /tmp/suikang-pwa.zip
          unzip -q /tmp/suikang-pwa.zip -d "$SITE_DIR"
          test -s "$SITE_DIR/index.html"
          test -s "$SITE_DIR/manifest.webmanifest"
          test -s "$SITE_DIR/sw.js"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pwa_site
      - name: Deploy PWA
        id: deployment
        uses: actions/deploy-pages@v4
