name: Export V236 Clean Source

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/export-v236-clean-source.yml'

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct source
        shell: bash
        run: |
          set -euxo pipefail
          cat payload/part*.b64 | base64 --decode > source.zip
          unzip -o source.zip -d src
          cd src
          base64 --decode ../payload/v11.patch.gz.b64 | gzip -d > /tmp/v11.patch
          patch -p1 < /tmp/v11.patch
          cp ../payload/v12_XlsxProductImporter.java app/src/main/java/com/suikang/sales/XlsxProductImporter.java
          cp ../payload/v2_DataStore.java app/src/main/java/com/suikang/sales/DataStore.java
          cp ../payload/v2_ChannelXlsxExporter.java app/src/main/java/com/suikang/sales/ChannelXlsxExporter.java
          cat ../payload/v236_main.part0.b64 ../payload/v236_main.rest.b64 | base64 --decode | gzip -d > app/src/main/java/com/suikang/sales/MainActivity.java
          base64 --decode ../payload/v236_models.java.gz.b64 | gzip -d > app/src/main/java/com/suikang/sales/Models.java
          base64 --decode ../payload/v236_pdf.java.gz.b64 | gzip -d > app/src/main/java/com/suikang/sales/PdfQuotationExporter.java
          base64 --decode ../payload/v236_link.java.gz.b64 | gzip -d > app/src/main/java/com/suikang/sales/ProductLinkImporter.java
          base64 --decode ../payload/v236_export.java.gz.b64 | gzip -d > app/src/main/java/com/suikang/sales/ProductLibraryXlsxExporter.java
          cd ..
          tar -czf v236-clean-source.tar.gz -C src .
      - uses: actions/upload-artifact@v4
        with:
          name: v236-clean-source
          path: v236-clean-source.tar.gz
          if-no-files-found: error
