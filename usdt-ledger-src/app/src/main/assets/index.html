<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#142238;--muted:#718096;--line:#e5ebf2;--brand:#10a673;--brand2:#0b865c;--danger:#d34a4a;--warn:#b87919;--blue:#2563eb;--shadow:0 9px 28px rgba(20,40,70,.08)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}.app{max-width:920px;margin:auto;min-height:100vh;padding-bottom:94px}.topbar{position:sticky;top:0;z-index:20;background:rgba(244,247,251,.95);backdrop-filter:blur(12px);padding:calc(12px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid rgba(230,235,242,.85)}.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px}.title{font-size:22px;font-weight:850}.subtitle{font-size:12px;color:var(--muted);margin-top:2px}.iconbtn{border:0;background:#fff;border-radius:12px;padding:10px 13px;box-shadow:var(--shadow)}.content{padding:16px}.hero{background:linear-gradient(135deg,#101b30,#17395d);color:#fff;border-radius:22px;padding:18px;box-shadow:var(--shadow)}.hero .cap{font-size:12px;color:#c0cee0}.hero .big{font-size:27px;font-weight:850;margin-top:5px}.hero-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:15px}.hero-box{background:rgba(255,255,255,.08);border-radius:14px;padding:10px}.hero-box .k{font-size:10px;color:#c8d4e4}.hero-box .v{font-size:14px;font-weight:800;margin-top:4px}.section-head{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 10px}.section-title{font-size:16px;font-weight:850}.small{font-size:12px;color:var(--muted)}.projects{display:grid;gap:12px}.project{background:#fff;border-radius:18px;padding:15px;box-shadow:var(--shadow);border:1px solid #edf1f6;cursor:pointer}.project-top{display:flex;justify-content:space-between;gap:12px}.project-name{font-size:17px;font-weight:850}.pill{font-size:11px;padding:5px 8px;border-radius:999px;background:#ecf8f3;color:var(--brand2)}.project-meta{font-size:12px;color:var(--muted);margin-top:5px}.project-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:13px}.metric{background:#f7f9fc;border-radius:12px;padding:10px}.metric .k{font-size:10px;color:var(--muted)}.metric .v{font-size:13px;font-weight:800;margin-top:4px}.profit.pos{color:var(--brand2)}.profit.neg{color:var(--danger)}.empty{background:#fff;border:1px dashed #ccd6e3;border-radius:18px;padding:30px 18px;text-align:center;color:var(--muted)}.empty b{display:block;color:var(--ink);margin-bottom:6px}.fab{position:fixed;right:max(18px,calc((100vw - 920px)/2 + 18px));bottom:calc(18px + env(safe-area-inset-bottom));z-index:25;border:0;background:var(--brand);color:#fff;border-radius:18px;padding:14px 18px;font-weight:850;box-shadow:0 12px 30px rgba(16,166,115,.35)}.detail-head{display:flex;align-items:center;gap:10px}.back{border:0;background:#fff;border-radius:12px;padding:9px 12px;box-shadow:var(--shadow)}.detail-title{font-weight:850;font-size:19px}.detail-sub{font-size:12px;color:var(--muted)}.summary-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}.sumcard{background:#fff;border-radius:16px;padding:13px;box-shadow:var(--shadow)}.sumcard .k{font-size:10px;color:var(--muted)}.sumcard .v{font-weight:850;font-size:17px;margin-top:5px}.toolbar{display:flex;gap:8px;overflow:auto;padding-bottom:4px}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;font-size:12px;white-space:nowrap}.chip.brand{background:#eaf7f2;color:var(--brand2);border-color:#d7efe5}.ledger{display:grid;gap:10px;margin-top:12px}.entry{background:#fff;border-radius:16px;padding:14px;border:1px solid #edf1f6;box-shadow:0 5px 18px rgba(20,40,70,.05)}.entry-top{display:flex;justify-content:space-between;gap:8px;align-items:center}.entry-date{font-size:13px;font-weight:750}.righttags{display:flex;gap:6px;align-items:center}.status,.dirbadge{font-size:10px;border-radius:999px;padding:4px 7px;white-space:nowrap}.status.done{background:#eaf7f2;color:var(--brand2)}.status.open{background:#fff4de;color:#95600f}.dirbadge{background:#eef4ff;color:#315ea9}.entry-main{display:flex;justify-content:space-between;gap:14px;margin-top:10px}.entry-cny{font-size:18px;font-weight:850}.entry-usdt{font-size:13px;color:var(--muted);margin-top:2px}.entry-profit{text-align:right}.entry-profit .p{font-weight:850}.entry-profit .r{font-size:10px;color:var(--muted);margin-top:3px}.entry-info{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:11px}.mini{background:#f7f9fc;border-radius:10px;padding:8px}.mini .k{font-size:9px;color:var(--muted)}.mini .v{font-size:12px;font-weight:750;margin-top:3px}.note{font-size:12px;color:var(--muted);margin-top:9px}.entry-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}.textbtn{border:0;background:transparent;color:var(--muted);font-size:12px;padding:5px}.textbtn.danger{color:var(--danger)}.modal{position:fixed;inset:0;z-index:50;background:rgba(10,20,35,.46);display:none;align-items:flex-end;justify-content:center}.modal.show{display:flex}.sheet{width:min(920px,100%);max-height:94vh;overflow:auto;background:#fff;border-radius:22px 22px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px rgba(0,0,0,.13)}.sheet-title{font-size:18px;font-weight:850;margin-bottom:13px}.form{display:grid;gap:12px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid #dfe6ef;border-radius:12px;padding:12px;background:#fbfcfe;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:#73cdb0;box-shadow:0 0 0 3px rgba(16,166,115,.08)}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.direction{display:grid;grid-template-columns:1fr 1fr;gap:9px}.dirbtn{border:1px solid #dce4ee;background:#f8fafc;border-radius:15px;padding:14px 9px;font-weight:850;color:#48566a}.dirbtn.active{border-color:#8ad6bc;background:#eaf8f3;color:#087752;box-shadow:inset 0 0 0 1px #8ad6bc}.dirhint{background:#f6f8fb;border-radius:11px;padding:9px 11px;font-size:11px;color:#627086}.seg{display:grid;grid-template-columns:1fr 1fr;gap:7px}.seg button{border:1px solid #dfe6ef;background:#fff;border-radius:11px;padding:10px;font-size:12px;font-weight:750}.seg button.active{background:#eef7ff;border-color:#bed7ff;color:#1d5fbf}.formula{background:#f1f8f5;border-radius:12px;padding:12px;font-size:12px;color:#45655b;line-height:1.65}.formula b{font-size:14px}.modal-actions{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;margin-top:14px}.btn{border:0;border-radius:13px;padding:13px;font-weight:850}.btn.secondary{background:#eef2f6}.btn.primary{background:var(--brand);color:#fff}.btn.danger{background:#fdeaea;color:var(--danger)}.menu{position:absolute;right:16px;top:64px;background:#fff;border-radius:14px;padding:7px;box-shadow:var(--shadow);border:1px solid #edf1f6;display:none;z-index:30}.menu.show{display:block}.menu button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:10px 12px;border-radius:9px}.fileinput{display:none}.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;background:#172437;color:#fff;padding:10px 14px;border-radius:10px;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:80}.toast.show{opacity:1}@media(min-width:700px){.projects{grid-template-columns:1fr 1fr}.summary-grid{grid-template-columns:repeat(4,1fr)}.sheet{border-radius:22px;margin-bottom:24px}.modal{align-items:center}}
</style>

<body>
<div id="app" class="app"></div><div id="modal" class="modal"></div><div id="toast" class="toast"></div><input id="importFile" class="fileinput" type="file" accept="application/json,.json" />
<script>
const KEY='usdt_acceptance_ledger_v1'; let state=load(); let currentProjectId=null,editingEntryId=null,editingProjectId=null; let formDirection='CNY_TO_USDT', formAdjust='UP', lastInput='cny';
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.projects)){x.projects.forEach(p=>(p.entries||[]).forEach(migrateEntry));return x}}catch(e){}return{projects:[]}}
function migrateEntry(e){if(!e.direction)e.direction='CNY_TO_USDT';if(e.baseRate==null)e.baseRate=e.costRate||'';if(e.adjustType==null)e.adjustType='UP';if(e.adjustValue==null){const b=n(e.baseRate),s=n(e.settleRate);e.adjustValue=b&&s?Math.abs(s-b):''}if(e.actualCostRate==null)e.actualCostRate=e.costRate||'';if(e.usdtAmount==null)e.usdtAmount=e.usdtManual||'';return e}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}function n(v){const x=parseFloat(v);return Number.isFinite(x)?x:0}function money(v,d=2){return n(v).toLocaleString('zh-CN',{minimumFractionDigits:d,maximumFractionDigits:d})}function esc(s=''){return String(s).replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600)}
function dealRate(e){const b=n(e.baseRate),a=n(e.adjustValue);return Math.max(0,e.adjustType==='DOWN'?b-a:b+a)}
function calcEntry(e){migrateEntry(e);const rate=dealRate(e),base=n(e.baseRate),cost=n(e.actualCostRate)||base,feeRate=n(e.feeRate);let cny=n(e.cnyAmount),usdt=n(e.usdtAmount);if(e.direction==='CNY_TO_USDT'){if(!usdt&&rate)usdt=cny/rate}else{if(!cny&&rate)cny=usdt*rate}const fee=e.feeManual!==''&&e.feeManual!=null?n(e.feeManual):cny*feeRate/100;let profit;if(e.profitManual!==''&&e.profitManual!=null)profit=n(e.profitManual);else if(e.direction==='CNY_TO_USDT')profit=cny-usdt*cost-fee;else profit=usdt*cost-cny-fee;return{cny,usdt,base,rate,cost,fee,profit,feeRate}}
function projectStats(p){return(p.entries||[]).reduce((a,e)=>{const c=calcEntry(e);a.cny+=c.cny;a.usdt+=c.usdt;a.profit+=c.profit;a.fee+=c.fee;if(e.status!=='已结清')a.open++;return a},{cny:0,usdt:0,profit:0,fee:0,open:0})}function totalStats(){return state.projects.reduce((a,p)=>{const s=projectStats(p);for(const k of ['cny','usdt','profit','fee','open'])a[k]+=s[k];return a},{cny:0,usdt:0,profit:0,fee:0,open:0})}
function render(){currentProjectId?renderDetail():renderHome()}
function renderHome(){const a=document.getElementById('app'),t=totalStats();a.innerHTML=`<div class="topbar"><div class="toprow"><div><div class="title">USDT承兑台账</div><div class="subtitle">按项目独立记账 · V2.0 双向兑换</div></div><button class="iconbtn" onclick="toggleMenu()">⋯</button></div><div id="menu" class="menu"><button onclick="exportAll()">导出全部备份</button><button onclick="document.getElementById('importFile').click();hideMenu()">导入备份</button><button onclick="exportAllCsv()">导出全部CSV</button></div></div><div class="content"><div class="hero"><div class="cap">全部项目累计人民币流水</div><div class="big">¥ ${money(t.cny)}</div><div class="hero-grid"><div class="hero-box"><div class="k">USDT流水</div><div class="v">₮ ${money(t.usdt,2)}</div></div><div class="hero-box"><div class="k">累计净利润</div><div class="v">${t.profit>=0?'+':''}¥ ${money(t.profit)}</div></div><div class="hero-box"><div class="k">未结清</div><div class="v">${t.open} 笔</div></div></div></div><div class="section-head"><div class="section-title">项目账本</div><div class="small">${state.projects.length} 个项目</div></div><div class="projects">${state.projects.length?state.projects.map(projectCard).join(''):`<div class="empty"><b>还没有项目</b>点击右下角“新建项目”开始记账</div>`}</div></div><button class="fab" onclick="openProjectModal()">＋ 新建项目</button>`}
function projectCard(p){const s=projectStats(p);return`<div class="project" onclick="openProject('${p.id}')"><div class="project-top"><div><div class="project-name">${esc(p.name)}</div><div class="project-meta">${esc(p.client||'未填写客户')}${p.manager?' · '+esc(p.manager):''}</div></div><span class="pill">${(p.entries||[]).length} 笔</span></div><div class="project-grid"><div class="metric"><div class="k">人民币流水</div><div class="v">¥${money(s.cny)}</div></div><div class="metric"><div class="k">USDT流水</div><div class="v">₮${money(s.usdt,2)}</div></div><div class="metric"><div class="k">净利润</div><div class="v profit ${s.profit>=0?'pos':'neg'}">${s.profit>=0?'+':''}¥${money(s.profit)}</div></div></div></div>`}
function getProject(){return state.projects.find(p=>p.id===currentProjectId)}function openProject(id){currentProjectId=id;render();scrollTo(0,0)}function goHome(){currentProjectId=null;render();scrollTo(0,0)}
function renderDetail(){const a=document.getElementById('app'),p=getProject();if(!p)return goHome();const s=projectStats(p),entries=[...(p.entries||[])].sort((x,y)=>(y.date||'').localeCompare(x.date||''));a.innerHTML=`<div class="topbar"><div class="detail-head"><button class="back" onclick="goHome()">‹</button><div><div class="detail-title">${esc(p.name)}</div><div class="detail-sub">${esc(p.client||'')} ${p.manager?'· '+esc(p.manager):''}</div></div></div></div><div class="content"><div class="summary-grid"><div class="sumcard"><div class="k">人民币流水</div><div class="v">¥${money(s.cny)}</div></div><div class="sumcard"><div class="k">USDT流水</div><div class="v">₮${money(s.usdt,2)}</div></div><div class="sumcard"><div class="k">净利润</div><div class="v profit ${s.profit>=0?'pos':'neg'}">${s.profit>=0?'+':''}¥${money(s.profit)}</div></div><div class="sumcard"><div class="k">未结清</div><div class="v">${s.open} 笔</div></div></div><div class="toolbar"><button class="chip brand" onclick="openEntryModal()">＋ 新增订单</button><button class="chip" onclick="openProjectModal('${p.id}')">项目设置</button><button class="chip" onclick="exportProjectCsv('${p.id}')">导出CSV</button><button class="chip" onclick="exportProjectJson('${p.id}')">备份项目</button></div><div class="ledger">${entries.length?entries.map(entryCard).join(''):`<div class="empty"><b>这个项目还没有订单</b>点击“新增订单”录入第一笔承兑</div>`}</div></div><button class="fab" onclick="openEntryModal()">＋ 新增订单</button>`}
function dirText(d){return d==='USDT_TO_CNY'?'USDT → 人民币':'人民币 → USDT'}
function entryCard(e){const c=calcEntry(e);return`<div class="entry"><div class="entry-top"><div class="entry-date">${esc(e.date||'未填日期')}</div><div class="righttags"><span class="dirbadge">${dirText(e.direction)}</span><span class="status ${e.status==='已结清'?'done':'open'}">${esc(e.status||'未结清')}</span></div></div><div class="entry-main"><div><div class="entry-cny">¥ ${money(c.cny)}</div><div class="entry-usdt">₮ ${money(c.usdt,4)} USDT</div></div><div class="entry-profit"><div class="p profit ${c.profit>=0?'pos':'neg'}">${c.profit>=0?'+':''}¥ ${money(c.profit)}</div><div class="r">净利润</div></div></div><div class="entry-info"><div class="mini"><div class="k">实时基准汇率</div><div class="v">${c.base?c.base.toFixed(4):'-'}</div></div><div class="mini"><div class="k">成交汇率</div><div class="v">${c.rate?c.rate.toFixed(4):'-'}</div></div><div class="mini"><div class="k">实际成本汇率</div><div class="v">${c.cost?c.cost.toFixed(4):'-'}</div></div></div>${e.note?`<div class="note">备注：${esc(e.note)}</div>`:''}<div class="entry-actions"><button class="textbtn" onclick="openEntryModal('${e.id}')">编辑</button><button class="textbtn danger" onclick="deleteEntry('${e.id}')">删除</button></div></div>`}
function openProjectModal(id){editingProjectId=id||null;const p=id?state.projects.find(x=>x.id===id):null;showModal(`<div class="sheet"><div class="sheet-title">${p?'编辑项目':'新建项目'}</div><div class="form"><div class="field"><label>项目名称 *</label><input id="p_name" value="${p?esc(p.name):''}" placeholder="例如：深圳A项目"></div><div class="two"><div class="field"><label>客户/对方</label><input id="p_client" value="${p?esc(p.client||''):''}"></div><div class="field"><label>负责人</label><input id="p_manager" value="${p?esc(p.manager||''):''}"></div></div><div class="field"><label>项目备注</label><textarea id="p_note" rows="3">${p?esc(p.note||''):''}</textarea></div></div><div class="modal-actions"><button class="btn secondary" onclick="closeModal()">取消</button><button class="btn primary" onclick="saveProjectForm()">保存项目</button></div>${p?`<button class="btn danger" style="width:100%;margin-top:10px" onclick="deleteProject('${p.id}')">删除整个项目</button>`:''}</div>`)}
function saveProjectForm(){const name=document.getElementById('p_name').value.trim();if(!name)return toast('请填写项目名称');const data={name,client:document.getElementById('p_client').value.trim(),manager:document.getElementById('p_manager').value.trim(),note:document.getElementById('p_note').value.trim()};if(editingProjectId)Object.assign(state.projects.find(x=>x.id===editingProjectId),data);else state.projects.unshift({id:uid(),...data,createdAt:new Date().toISOString(),entries:[]});save();closeModal();render();toast('项目已保存')}
function deleteProject(id){if(!confirm('确定删除这个项目及全部订单吗？'))return;state.projects=state.projects.filter(p=>p.id!==id);save();closeModal();if(currentProjectId===id)currentProjectId=null;render();toast('项目已删除')}
function openEntryModal(id){const p=getProject();if(!p)return;editingEntryId=id||null;const e=id?migrateEntry(p.entries.find(x=>x.id===id)):null;const today=new Date().toISOString().slice(0,10);formDirection=e?.direction||'CNY_TO_USDT';formAdjust=e?.adjustType||'UP';lastInput=formDirection==='CNY_TO_USDT'?'cny':'usdt';showModal(`<div class="sheet"><div class="sheet-title">${e?'编辑承兑订单':'新增承兑订单'}</div><div class="form"><div class="field"><label>兑换方向 *</label><div class="direction"><button id="d_c2u" class="dirbtn" onclick="setDirection('CNY_TO_USDT')">人民币 → USDT</button><button id="d_u2c" class="dirbtn" onclick="setDirection('USDT_TO_CNY')">USDT → 人民币</button></div><div id="dirhint" class="dirhint"></div></div><div class="two"><div class="field"><label>日期 *</label><input type="date" id="e_date" value="${e?esc(e.date):today}"></div><div class="field"><label>结算状态</label><select id="e_status"><option ${e?.status!=='已结清'?'selected':''}>未结清</option><option ${e?.status==='已结清'?'selected':''}>已结清</option></select></div></div><div class="field"><label>实时基准汇率 *</label><input type="number" step="0.0001" id="e_base" value="${e?.baseRate??''}" placeholder="例如 6.9000" oninput="syncAmounts()"></div><div class="two"><div class="field"><label>调整方式</label><div class="seg"><button id="a_up" onclick="setAdjust('UP')">上浮 ＋</button><button id="a_down" onclick="setAdjust('DOWN')">下浮 －</button></div></div><div class="field"><label>浮动值</label><input type="number" step="0.0001" id="e_adjust" value="${e?.adjustValue??''}" placeholder="例如 0.0300" oninput="syncAmounts()"></div></div><div class="field"><label>成交汇率（自动）</label><input id="e_deal" disabled></div><div class="two"><div class="field"><label>人民币金额 CNY</label><input type="number" step="0.01" id="e_cny" value="${e?.cnyAmount??''}" placeholder="输入人民币金额" oninput="lastInput='cny';syncAmounts()"></div><div class="field"><label>USDT数量</label><input type="number" step="0.0001" id="e_usdt" value="${e?.usdtAmount??e?.usdtManual??''}" placeholder="输入USDT数量" oninput="lastInput='usdt';syncAmounts()"></div></div><div class="two"><div class="field"><label>实际成本汇率</label><input type="number" step="0.0001" id="e_cost" value="${e?.actualCostRate??''}" placeholder="留空=实时基准汇率" oninput="updateFormula()"></div><div class="field"><label>手续费率 %</label><input type="number" step="0.0001" id="e_feeRate" value="${e?.feeRate??0}" oninput="updateFormula()"></div></div><div class="two"><div class="field"><label>手续费 CNY（可覆盖）</label><input type="number" step="0.01" id="e_fee" value="${e?.feeManual??''}" placeholder="留空自动算" oninput="updateFormula()"></div><div class="field"><label>利润 CNY（可覆盖）</label><input type="number" step="0.01" id="e_profit" value="${e?.profitManual??''}" placeholder="留空自动算" oninput="updateFormula()"></div></div><div id="formula" class="formula"></div><div class="field"><label>备注</label><textarea id="e_note" rows="3" placeholder="付款账户、对方名称、凭证说明等">${e?esc(e.note||''):''}</textarea></div></div><div class="modal-actions"><button class="btn secondary" onclick="closeModal()">取消</button><button class="btn primary" onclick="saveEntryForm()">保存订单</button></div></div>`);refreshDirUI();refreshAdjustUI();syncAmounts()}
function setDirection(d){formDirection=d;lastInput=d==='CNY_TO_USDT'?'cny':'usdt';refreshDirUI();syncAmounts()}function refreshDirUI(){document.getElementById('d_c2u')?.classList.toggle('active',formDirection==='CNY_TO_USDT');document.getElementById('d_u2c')?.classList.toggle('active',formDirection==='USDT_TO_CNY');const h=document.getElementById('dirhint');if(h)h.textContent=formDirection==='CNY_TO_USDT'?'对方用人民币换 USDT：人民币 → USDT':'对方用 USDT 换人民币：USDT → 人民币'}
function setAdjust(a){formAdjust=a;refreshAdjustUI();syncAmounts()}function refreshAdjustUI(){document.getElementById('a_up')?.classList.toggle('active',formAdjust==='UP');document.getElementById('a_down')?.classList.toggle('active',formAdjust==='DOWN')}
function formEntry(){return{direction:formDirection,baseRate:document.getElementById('e_base')?.value||'',adjustType:formAdjust,adjustValue:document.getElementById('e_adjust')?.value||'',cnyAmount:document.getElementById('e_cny')?.value||'',usdtAmount:document.getElementById('e_usdt')?.value||'',actualCostRate:document.getElementById('e_cost')?.value||'',feeRate:document.getElementById('e_feeRate')?.value||'',feeManual:document.getElementById('e_fee')?.value||'',profitManual:document.getElementById('e_profit')?.value||''}}
function syncAmounts(){const base=n(document.getElementById('e_base')?.value),adj=n(document.getElementById('e_adjust')?.value),rate=Math.max(0,formAdjust==='DOWN'?base-adj:base+adj);const deal=document.getElementById('e_deal');if(deal)deal.value=rate?rate.toFixed(4):'';const cny=document.getElementById('e_cny'),usdt=document.getElementById('e_usdt');if(rate&&cny&&usdt){if(lastInput==='cny'&&cny.value!=='')usdt.value=(n(cny.value)/rate).toFixed(4);else if(lastInput==='usdt'&&usdt.value!=='')cny.value=(n(usdt.value)*rate).toFixed(2)}updateFormula()}
function updateFormula(){const box=document.getElementById('formula');if(!box)return;const e=formEntry(),c=calcEntry(e),sign=formAdjust==='DOWN'?'−':'＋';const rule=formDirection==='CNY_TO_USDT'?'人民币 ÷ 成交汇率 = USDT；利润 = 收到人民币 − USDT×实际成本 − 手续费':'USDT × 成交汇率 = 人民币；利润 = USDT×实际成本 − 付出人民币 − 手续费';box.innerHTML=`成交汇率：<b>${c.rate?c.rate.toFixed(4):'-'}</b>（${c.base?c.base.toFixed(4):'-'} ${sign} ${n(e.adjustValue).toFixed(4)}）<br>折算结果：<b>¥${money(c.cny)}</b> ⇄ <b>₮${money(c.usdt,4)}</b><br>预计净利润：<b class="profit ${c.profit>=0?'pos':'neg'}">${c.profit>=0?'+':''}¥${money(c.profit)}</b><br><span style="font-size:10px">${rule}</span>`}
function saveEntryForm(){const p=getProject();if(!p)return;const date=document.getElementById('e_date').value,base=document.getElementById('e_base').value,cny=document.getElementById('e_cny').value,usdt=document.getElementById('e_usdt').value;if(!date||!base||!cny||!usdt)return toast('请填写日期、实时汇率和兑换金额');const data={date,status:document.getElementById('e_status').value,...formEntry(),note:document.getElementById('e_note').value.trim()};if(editingEntryId)Object.assign(p.entries.find(x=>x.id===editingEntryId),data);else p.entries.push({id:uid(),...data,createdAt:new Date().toISOString()});save();closeModal();render();toast('订单已保存')}
function deleteEntry(id){const p=getProject();if(!p||!confirm('确定删除这笔订单吗？'))return;p.entries=p.entries.filter(e=>e.id!==id);save();render();toast('订单已删除')}function showModal(html){const m=document.getElementById('modal');m.innerHTML=html;m.classList.add('show');m.onclick=ev=>{if(ev.target===m)closeModal()}}function closeModal(){document.getElementById('modal').classList.remove('show');editingEntryId=null;editingProjectId=null}
function toggleMenu(){document.getElementById('menu')?.classList.toggle('show')}function hideMenu(){document.getElementById('menu')?.classList.remove('show')}function safeName(s){return String(s||'项目').replace(/[\\/:*?"<>|]/g,'_')}
function download(name,text,type='text/plain;charset=utf-8'){if(window.AndroidBridge&&AndroidBridge.saveText){AndroidBridge.saveText(name,text,type);return}const blob=new Blob([text],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function exportAll(){download(`USDT承兑台账_全部备份_${new Date().toISOString().slice(0,10)}.json`,JSON.stringify(state,null,2),'application/json');hideMenu()}function exportProjectJson(id){const p=state.projects.find(x=>x.id===id);if(p)download(`${safeName(p.name)}_备份.json`,JSON.stringify({projects:[p]},null,2),'application/json')}
function csvForProjects(projects){const rows=[['项目','日期','兑换方向','客户','负责人','实时基准汇率','调整方式','浮动值','成交汇率','人民币金额','USDT数量','实际成本汇率','手续费CNY','净利润CNY','状态','备注']];projects.forEach(p=>(p.entries||[]).forEach(e=>{const c=calcEntry(e);rows.push([p.name,e.date,dirText(e.direction),p.client||'',p.manager||'',c.base,e.adjustType==='DOWN'?'下浮':'上浮',n(e.adjustValue),c.rate,c.cny,c.usdt,c.cost,c.fee,c.profit,e.status||'',e.note||''])}));return'\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n')}
function exportProjectCsv(id){const p=state.projects.find(x=>x.id===id);if(p)download(`${safeName(p.name)}_台账.csv`,csvForProjects([p]),'text/csv;charset=utf-8')}function exportAllCsv(){download('USDT承兑台账_全部项目.csv',csvForProjects(state.projects),'text/csv;charset=utf-8');hideMenu()}
document.getElementById('importFile').addEventListener('change',async ev=>{const f=ev.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!data||!Array.isArray(data.projects))throw 0;if(!confirm(`将导入 ${data.projects.length} 个项目，是否继续？`))return;const ids=new Set(state.projects.map(p=>p.id));data.projects.forEach(p=>{if(ids.has(p.id))p.id=uid();p.entries=(p.entries||[]).map(e=>{migrateEntry(e);return{...e,id:e.id||uid()}});state.projects.push(p)});save();render();toast('导入完成')}catch(e){alert('导入失败：备份文件格式不正确')}finally{ev.target.value=''}});render();
</script>
</body></html>
