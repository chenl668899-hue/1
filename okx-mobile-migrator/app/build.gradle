plugins {
    id 'com.android.application'
}

android {
    namespace 'com.okx.migrator'
    compileSdk 35

    defaultConfig {
        applicationId 'com.okx.migrator.rescue'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1.0-rescue'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
